name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Build application image
        run: ./mvnw spring-boot:build-image -Dspring-boot.build-image.imageName=triagemoncologica:0.0.1 -DskipTests

      - name: Tag image
        run: docker tag triagemoncologica:0.0.1 joaovictorgi/backend-onco-flow:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        run: docker push joaovictorgi/backend-onco-flow:latest

      - name: Deploy to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          COMPOSE_FILE_PATH: ${{ secrets.COMPOSE_FILE_PATH }}
        run: |
          echo "$SSH_KEY" > key.pem
          chmod 600 key.pem
          ssh -i key.pem -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} "cd ${COMPOSE_FILE_PATH} && docker-compose stop backend"
          ssh -i key.pem -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} "docker pull joaovictorgi/backend-onco-flow:latest"
          ssh -i key.pem -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} "cd ${COMPOSE_FILE_PATH} && docker-compose up -d backend"
          rm key.pem
