name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Build application image
        run: ./mvnw spring-boot:build-image -Dspring-boot.build-image.imageName=triagemoncologica:0.0.1 -DskipTests

      - name: Tag image
        run: docker tag triagemoncologica:0.0.1 joaovictorgi/backend-onco-flow:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        run: docker push joaovictorgi/backend-onco-flow:latest

      - name: Deploy to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          COMPOSE_FILE_PATH: ${{ secrets.COMPOSE_FILE_PATH }}
        run: |
          set -euo pipefail
          echo "$SSH_KEY" > key.pem
          chmod 600 key.pem
          trap 'rm -f key.pem' EXIT

          ssh_with_retry() {
            local command="$1"
            local max_attempts=3
            local attempt=1
            local ssh_options="-i key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=20"

            while [ "$attempt" -le "$max_attempts" ]; do
              if ssh $ssh_options "${EC2_USER}@${EC2_HOST}" "$command"; then
                return 0
              fi

              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "SSH command failed (attempt $attempt/$max_attempts). Retrying in 10 seconds..."
                sleep 10
              fi

              attempt=$((attempt + 1))
            done

            echo "SSH command failed after $max_attempts attempts."
            return 1
          }

          ssh_with_retry "cd ${COMPOSE_FILE_PATH} && docker-compose stop backend"
          ssh_with_retry "docker pull joaovictorgi/backend-onco-flow:latest"
          ssh_with_retry "cd ${COMPOSE_FILE_PATH} && docker-compose up -d backend"
