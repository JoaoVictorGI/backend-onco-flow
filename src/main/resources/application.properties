spring.application.name=triagemoncologica
spring.threads.virtual.enabled=true
server.address=0.0.0.0
###
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
###
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
###
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
### JWT
app.jwt.issuer=Onco-Flow
app.jwt.private-key=classpath:certs.example/private.pem
app.jwt.public-key=classpath:certs.example/public.pem
app.jwt.expires-at=604800
### Admin
app.admin.nome-completo=admin
app.admin.email=admin@example.com
app.admin.password=admin
